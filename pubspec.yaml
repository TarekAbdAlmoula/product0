name: product0
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.0
  google_fonts: ^6.3.0
  dio: ^5.9.0
  flutter_bloc: ^9.1.1
  url_launcher: ^6.3.2
  device_preview: ^1.3.1
  font_awesome_flutter: ^10.9.1
  flutter_rating_bar: ^4.0.1
  fluttertoast: ^8.2.14
  awesome_dialog: ^3.2.1
  go_router: ^16.2.1
  convex_bottom_bar: ^3.2.0
  pin_code_fields: ^8.0.1
  flutter_secure_storage: ^9.2.4
  firebase_core: ^4.1.1
  firebase_messaging: ^16.0.2
  flutter_launcher_icons: ^0.14.4
  cached_network_image: ^3.4.1
  dropdown_button2: ^2.3.9
  loading_indicator: ^3.1.1
  photo_view: ^0.15.0
  carousel_slider: ^5.1.1
  lottie: ^3.3.1
  flutter_native_splash: ^2.4.7
  flutter_html: ^3.0.0
  flutter_typeahead: ^5.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon_zoomed.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
